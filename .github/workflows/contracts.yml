name: contracts

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  portable-core:
    name: Portable C++ core and contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure engine-independent tests
        run: cmake -S . -B out/ci-core -DSYNTH_BUILD_CORE_TESTS=ON -DSYNTH_BUILD_VR=OFF
      - name: Build engine-independent tests
        run: cmake --build out/ci-core --parallel 2
      - name: Run all engine-independent tests
        run: ctest --test-dir out/ci-core --output-on-failure
      - name: Validate protocol and build gates
        run: |
          python3 scripts/verify_protocol.py
          python3 tests/build/test_build_gates.py
      - name: Record evidence boundary
        if: always()
        run: |
          printf '%s\n' 'This job proves the engine-independent C++ suites, protocol fixtures, settings-catalog contracts, and build gates.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'It does not run packaging tests; release packages are built and audited locally.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'It does not claim a Windows DLL build or Fallout 4 gameplay.' >> "$GITHUB_STEP_SUMMARY"
