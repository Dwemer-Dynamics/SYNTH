; Safe sample configuration. Copy to Data/F4SE/Plugins/SYNTH.ini.
; This file is the shipped default for every SYNTH setting.
; User overrides belong in SYNTH_custom.ini, which is intentionally ignored by Git.
; The in-game SYNTH pages (F4SE Menu Framework), hand edits, and external tools
; may edit SYNTH_custom.ini. This file and that override are the only settings state.

[Server]
; Loopback HTTP is the only enabled default. Do not put API keys or credentials here.
BaseUrl=http://127.0.0.1:8087/Synthserver/
ConnectTimeoutMs=2000
RequestTimeoutMs=30000
AllowRemote=false
; Show one in-game notice when the server stops answering and one when it answers again.
ConnectionNotice=true
; Opt in to the server's optional wake-up channel: while it is reachable the plugin waits for a content-free hint
; instead of polling speech readiness as often. Off by default; polling always works without it.
WakeChannel=false
; Ask the server for queued speech results: it names a message id for each voiced line and the plugin fetches that result
; from the server's durable queue, which hands it over exactly once. A live wake-up channel announces completion; without
; one the plugin polls. A server that does not queue keeps the status poll, so this is safe to leave on.
MessageQueue=false

[Runtime]
Enabled=true
LogLevel=info
DiagnosticsIncludePayloads=false

[Limits]
MaxResponseBytes=1048576
MaxPendingRequests=8

[Input]
PushToTalkEnabled=true
OpenMicrophone=false

; DirectInput (DIK) scan codes, matching the F4SE Menu Framework hotkey pages.
; 0 leaves a hotkey unbound, which is the shipped default for all nine.
; Flat first use: open SYNTH > Hotkeys. Bind Chatbox or Hold to Talk, plus SYNTH Control.
; Without the flat Menu Framework (including VR), set scan codes in SYNTH_custom.ini.
[Hotkeys]
TalkToNPC=0
ToggleVoice=0
SYNTHControl=0
ManualActivate=0
StopTalking=0
PipVision=0
OpenMicMute=0
WriteDiary=0
CancelConversation=0

[AutoActivate]
Enabled=true
AutoAddHostile=false
AutoAddCreatures=false

[Distance]
ActivatingNpcInterior=1200
ActivatingNpcExterior=2400

[SpatialAudio]
InteriorHearingDistance=1050
ExteriorHearingDistance=1750
AutoHearingDistance=784

[Behavior]
AIResponseTimeout=30
PauseDialogueOnMenu=true
ShowAISubtitles=true
SceneSafety=true
EnableCombatDialogue=false
CancelDialogueOnCombat=true

[RpgEvents]
CombatBarksEnabled=true
CombatBarkPeriodSeconds=30
CompanionCombatComments=false

[DynamicProfile]
TimerMinutes=30
IncludeNarrator=true

[BoredEvents]
TimerSeconds=60

[Rechat]
EndConversationCooldown=60

[Audio]
VoiceVolume=75
HeadVoiceVolume=100
Enable3DPlayback=true
DistanceScale=2.0
PlaybackDropoffInteriorPercent=70
PlaybackDropoffExteriorPercent=70
InvertHeading=false
PreClipMs=100
PostClipMs=100
AnimationResolution=500
AnimationIntensity=1.0

[OpenMic]
Enabled=false
Muted=false
Sensitivity=1000
EndDelaySeconds=1.0

[Tools]
InitializeSYNTH=false
